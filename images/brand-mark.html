<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>K&amp;C monogram</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 64px; height: 64px; overflow: hidden; }
  .mark {
    width: 64px; height: 64px;
    background: #f7f1e4;                     /* ivory */
    border: 1.5px solid #b3a07c;             /* gold hairline */
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .mono {
    font-family: 'Great Vibes', cursive;
    font-size: 38px; line-height: 1;
    color: #2a2317;                           /* warm ink */
    transform: translate(1px, 3px);           /* optical centering (Great Vibes ink leans left) */
  }
</style>
</head>
<body>
  <div class="mark">
    <span class="mono">K&amp;C</span>
  </div>
</body>
</html>
