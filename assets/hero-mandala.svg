<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Keshava and Cayla monogram mandala</title>
  <desc id="desc">A delicate Indian-inspired arch and mandala line drawing in warm sage and ink.</desc>
  <!-- Reference mark (NOT rendered by any page since R70/R77; kept as the
       hand-crafted-SVG pattern). Colours verified against the live tokens in
       css/styles.css: sage #4a6f5c, ink #2a2317, maroon-deep #37513f.
       Monogram is K&C per docs/brand-identity.md (never the stale K&B). -->
  <!-- Outer mandala ring -->
  <circle cx="200" cy="220" r="150" stroke="#4a6f5c" stroke-width="1.4" opacity="0.55" pathLength="1"/>
  <circle cx="200" cy="220" r="138" stroke="#4a6f5c" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 6" pathLength="1"/>
  <circle cx="200" cy="220" r="120" stroke="#2a2317" stroke-width="0.9" opacity="0.5" pathLength="1"/>
  <!-- Mandala petals (12-point) -->
  <g stroke="#4a6f5c" stroke-width="1.1" opacity="0.5">
    <g transform="rotate(0 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
    <g transform="rotate(30 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
    <g transform="rotate(60 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
    <g transform="rotate(90 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
    <g transform="rotate(120 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
    <g transform="rotate(150 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
    <g transform="rotate(180 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
    <g transform="rotate(210 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
    <g transform="rotate(240 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
    <g transform="rotate(270 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
    <g transform="rotate(300 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
    <g transform="rotate(330 200 220)"><path d="M200 110 Q216 150 200 180 Q184 150 200 110Z"/></g>
  </g>
  <!-- Inner lotus -->
  <g stroke="#2a2317" stroke-width="1" opacity="0.45">
    <g transform="rotate(0 200 220)"><path d="M200 150 Q212 185 200 215 Q188 185 200 150Z"/></g>
    <g transform="rotate(45 200 220)"><path d="M200 150 Q212 185 200 215 Q188 185 200 150Z"/></g>
    <g transform="rotate(90 200 220)"><path d="M200 150 Q212 185 200 215 Q188 185 200 150Z"/></g>
    <g transform="rotate(135 200 220)"><path d="M200 150 Q212 185 200 215 Q188 185 200 150Z"/></g>
    <g transform="rotate(180 200 220)"><path d="M200 150 Q212 185 200 215 Q188 185 200 150Z"/></g>
    <g transform="rotate(225 200 220)"><path d="M200 150 Q212 185 200 215 Q188 185 200 150Z"/></g>
    <g transform="rotate(270 200 220)"><path d="M200 150 Q212 185 200 215 Q188 185 200 150Z"/></g>
    <g transform="rotate(315 200 220)"><path d="M200 150 Q212 185 200 215 Q188 185 200 150Z"/></g>
  </g>
  <!-- Arch (temple door) around the monogram -->
  <path d="M120 380 L120 300 Q120 220 200 220 Q280 220 280 300 L280 380" stroke="#4a6f5c" stroke-width="1.6" opacity="0.7" pathLength="1"/>
  <path d="M132 380 L132 304 Q132 232 200 232 Q268 232 268 304 L268 380" stroke="#2a2317" stroke-width="0.8" opacity="0.4" pathLength="1"/>
  <!-- Monogram inside the arch (K & C, see docs/brand-identity.md) -->
  <text x="200" y="330" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="44" fill="#2a2317" opacity="0.85">K</text>
  <text x="200" y="356" text-anchor="middle" font-family="Great Vibes, cursive" font-size="30" fill="#37513f" opacity="0.85">&amp;</text>
  <text x="200" y="384" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="40" fill="#2a2317" opacity="0.85">C</text>
  <!-- Floor line under arch -->
  <path d="M96 380 L304 380" stroke="#4a6f5c" stroke-width="1.2" opacity="0.55"/>
  <!-- Small paisley accents -->
  <g stroke="#4a6f5c" stroke-width="1" opacity="0.45">
    <path d="M70 210 Q84 198 92 214 Q78 222 70 210Z"/>
    <path d="M330 210 Q316 198 308 214 Q322 222 330 210Z"/>
  </g>
</svg>
