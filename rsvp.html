<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP — Keshava & [Bride]</title>
<meta name="description" content="RSVP for Keshava and [Bride]'s wedding — let us know you're coming, your meal choice, and a song request.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="scroll-progress" aria-hidden="true"></div>
<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="script">Keshava</span>&amp; <span class="script">[Bride]</span></a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" >Home</a>
      <a href="index.html#timeline" >The Day</a>
      <a href="travel.html" >Travel</a>
      <a href="story.html" >Our Story</a>
      <a href="faq.html" >FAQ</a>
      <a href="rsvp.html" aria-current="page">RSVP</a>
      <a href="gallery.html" >Gallery</a>      <a href="invitation.html" >Invitation</a>
      <a href="contact.html" >Contact</a>


      <a href="guestbook.html" >Guestbook</a>
    </nav>
  </div>
</header>
<main>
  <section class="section" style="padding-top:var(--s8);">
    <div class="wrap-narrow center">
      <p class="eyebrow">Will you join us?</p>
      <h2 style="font-size:clamp(32px,5vw,50px);color:var(--ink);">RSVP</h2>
      <hr class="gold-rule">
      <p class="intro-copy">Please let us know by <strong style="color:var(--maroon);">[RSVP date]</strong> so we can plan the celebration around you.</p>
    </div>

    <div class="gb-form-card card reveal" style="margin-top:var(--s5);">
      <form id="rsvp-form" novalidate>
        <div class="gb-field">
          <label for="rsvp-name">Full name(s)</label>
          <input id="rsvp-name" name="name" type="text" maxlength="100" required autocomplete="name" placeholder="Jane Smith">
        </div>
        <div class="gb-field">
          <label for="rsvp-email">Email</label>
          <input id="rsvp-email" name="email" type="email" required autocomplete="email" placeholder="jane@example.com">
        </div>
        <div class="gb-field">
          <label>Will you attend?</label>
          <div class="rsvp-choice" role="radiogroup" aria-label="Will you attend?">
            <label class="rsvp-option"><input type="radio" name="attending" value="yes" checked><span>Joyfully accept</span></label>
            <label class="rsvp-option"><input type="radio" name="attending" value="no"><span>Regretfully decline</span></label>
          </div>
        </div>
        <div class="gb-field" id="guest-count-field">
          <label for="rsvp-guests">Number in your party</label>
          <select id="rsvp-guests" name="guests">
            <option value="1">1 — just me</option>
            <option value="2" selected>2 — me + one</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5+</option>
          </select>
        </div>
        <div class="gb-field" id="meal-field">
          <label for="rsvp-meal">Meal preference</label>
          <select id="rsvp-meal" name="meal">
            <option value="vegetarian">Vegetarian (Indian)</option>
            <option value="chicken">Chicken (Indian)</option>
            <option value="lamb">Lamb (Indian)</option>
            <option value="kids">Kids' plate</option>
            <option value="none">No meal needed</option>
          </select>
        </div>
        <div class="gb-field">
          <label for="rsvp-song">Song request for the reception <span style="text-transform:none;letter-spacing:0;">(optional)</span></label>
          <input id="rsvp-song" name="song" type="text" maxlength="120" placeholder="Anything you want to hear on the dance floor!">
        </div>
        <div class="gb-field">
          <label for="rsvp-notes">Dietary needs or notes <span style="text-transform:none;letter-spacing:0;">(optional)</span></label>
          <textarea id="rsvp-notes" name="notes" rows="3" maxlength="500" placeholder="Allergies, accessibility, anything we should know…"></textarea>
        </div>
        <button class="btn btn-maroon btn-block" type="submit">Send RSVP</button>
      </form>
    </div>
  </section>
</main>
<footer class="site-footer">
  <div class="wrap">
    <div class="script">Keshava &amp; [Bride]</div>
    <p>One day · Two traditions · A lifetime together</p>
    <div class="footer-links">
      <a href="index.html">Home</a><a href="travel.html">Travel</a><a href="faq.html">FAQ</a><a href="rsvp.html">RSVP</a><a href="guestbook.html">Guestbook</a>
    </div>
  </div>
</footer>
<button class="scroll-top" aria-label="Back to top" title="Back to top">↑</button>
<script>
  (function(){
    var t = document.querySelector('.nav-toggle');
    if (t) {
      t.addEventListener('click', function(){
        var l = document.querySelector('.nav-links');
        var open = l.classList.toggle('open');
        t.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: 0.12 });
    var revealEls = document.querySelectorAll('.reveal');
    for (var i = 0; i < revealEls.length; i++) io.observe(revealEls[i]);
    window.addEventListener('load', function(){
      revealEls.forEach(function(el){
        var r = el.getBoundingClientRect();
        if (r.top < window.innerHeight * 0.9) el.classList.add('in');
      });
    });

    // RSVP form: decline hides party/meal fields
    var form = document.getElementById('rsvp-form');
    var attending = document.querySelectorAll('input[name=attending]');
    var guestCount = document.getElementById('guest-count-field');
    var mealField = document.getElementById('meal-field');
    var toggleFields = function(){
      var yes = document.querySelector('input[name=attending]:checked').value === 'yes';
      guestCount.style.display = yes ? '' : 'none';
      mealField.style.display = yes ? '' : 'none';
    };
    attending.forEach(function(r){ r.addEventListener('change', toggleFields); });
    toggleFields();

    form.addEventListener('submit', function(e){
      e.preventDefault();
      var name = document.getElementById('rsvp-name').value.trim();
      var email = document.getElementById('rsvp-email').value.trim();
      if (!name || !email) { alert('Please add your name and email.'); return; }
      var attendingVal = document.querySelector('input[name=attending]:checked').value;
      var msg = attendingVal === 'yes'
        ? 'Thank you! We can\u2019t wait to celebrate with you.'
        : 'Thank you for letting us know. You\u2019ll be missed!';
      // Store locally (demo; wire to a form service or backend when live)
      try {
        var list = JSON.parse(localStorage.getItem('wedding-rsvps') || '[]');
        list.push({
          name: name, email: email, attending: attendingVal,
          guests: document.getElementById('rsvp-guests').value,
          meal: document.getElementById('rsvp-meal').value,
          song: document.getElementById('rsvp-song').value.trim(),
          notes: document.getElementById('rsvp-notes').value.trim(),
          ts: Date.now()
        });
        localStorage.setItem('wedding-rsvps', JSON.stringify(list));
      } catch(err) {}
      form.reset();
      toggleFields();
      alert(msg);
    });
  })();
</script>
<script src="js/site-motion.js"></script>
</body>
</html>
